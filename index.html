
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Aplikasi Dokumentasi Pengiriman Barang">
  <title>Dokumentasi Pengiriman</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    header {
      height: 58px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1f2937;
      border-bottom: 1px solid #374151;
    }

    .brand {
      font-size: 16px;
      font-weight: bold;
    }

    .status {
      font-size: 11px;
      color: #9ca3af;
    }

    main {
      height: calc(100dvh - 58px);
      padding: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: white;
    }

    #installButton {
      display: none;
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 10;
      border: 0;
      border-radius: 30px;
      padding: 13px 18px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      box-shadow: 0 4px 15px #0005;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">DOKUMENTASI PENGIRIMAN</div>
    <div class="status">Online</div>
  </header>

  <main>
    <iframe
      src="https://script.google.com/macros/s/AKfycbwwno76YsOCi8Pu-vGCpY8_CZ9qkj7iCm718hbLhYgWS_kS5GRSh9jWCO53XGyOwb3k/exec"
      title="Aplikasi Dokumentasi Pengiriman"
      allow="clipboard-read; clipboard-write"
      loading="eager">
    </iframe>
  </main>

  <button id="installButton">Install Aplikasi</button>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("Service Worker:", error));
      });
    }

    let installPrompt;

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      installPrompt = event;
      document.getElementById("installButton").style.display = "block";
    });

    document.getElementById("installButton").addEventListener("click", async () => {
      if (!installPrompt) return;

      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      document.getElementById("installButton").style.display = "none";
    });
  </script>
</body>
</html>
